name = "memos-worker"
compatibility_date = "2025-08-19"
main = "src/index.js"
[assets]
directory = "./src/public"
run_worker_first = [
	"/api/*"
]

[[d1_databases]]
binding = "DB"
database_id = "ed35a721-f3eb-48dd-8199-2aa4dc653af8"
database_name = "notes-db"

[[kv_namespaces]]
binding = "NOTES_KV"
id = "0e986521fb0844f09828337b3518c11a"
preview_id = ""

[[r2_buckets]]
binding = "NOTES_R2_BUCKET"
bucket_name = "notes-r2-bucket"
preview_bucket_name = "notes-files-preview"
